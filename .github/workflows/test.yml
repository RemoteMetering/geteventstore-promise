# CI for @metronomic/kurrentdb-client.
#
# Two jobs run on every push and pull request:
#   lint     - eslint and prettier, no server needed
#   test     - the full surface under coverage (pnpm coverage). It runs the community 26.1
#              image insecure then secure (TCP excluded, as that image ships no TCP interface),
#              then the 21.10 image secure (TCP included), all into one shared c8 temp
#              directory, so the merged report reflects the whole codebase. The first two passes
#              are the same runs as pnpm test, so a separate pnpm test job would repeat them
#
# The test suites start KurrentDB themselves through tests/_globalHooks.js, which shells out
# to `docker compose` (v2), so the runner only needs Docker. GitHub-hosted ubuntu runners
# already ship both Docker and the compose v2 plugin.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  PNPM_VERSION: 11
  NODE_VERSION: 24

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run full surface with coverage (26.1 insecure and secure, then 21.10 secure)
        run: pnpm coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
