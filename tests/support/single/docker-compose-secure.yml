version: "3.5"

services:
  volumes-provisioner:
    image: hasnat/volumes-provisioner
    environment:
      PROVISION_DIRECTORIES: "1000:1000:0755:/tmp/certs"
    volumes:
      - certs:/tmp/certs
    network_mode: none

  geteventstore_promise_test_setup_certs_single:
    image: eventstore/es-gencert-cli:1.0.2
    entrypoint: bash
    user: "0:0"
    command: >
      -c "mkdir -p ./certs && cd /certs
      && es-gencert-cli create-ca
      && es-gencert-cli create-node -out ./single -ip-addresses 127.0.0.1,172.30.239.11 -dns-names localhost
      && find . -type f -print0 | xargs -0 chmod 666"
    container_name: geteventstore_promise_test_setup_certs_single
    volumes:
      - ./certs:/certs
    depends_on:
      - volumes-provisioner
    networks:
      singleclusternetwork:
        ipv4_address: 172.30.239.10

  geteventstore_promise_test_single.eventstore:
    image: kurrentplatform/kurrentdb:25.0
    container_name: geteventstore_promise_test_single.eventstore
    environment:
      - KURRENTDB_MEM_DB=true
      - KURRENTDB_CLUSTER_SIZE=1
      - KURRENTDB_RUN_PROJECTIONS=All
      - KURRENTDB_START_STANDARD_PROJECTIONS=true
      - KURRENTDB_REPLICATION_IP=172.30.239.11
      - KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP=true
      - KURRENTDB_DISCOVER_VIA_DNS=false
      - KURRENTDB_ADVERTISE_HOST_TO_CLIENT_AS=127.0.0.1
      - KURRENTDB_NODE_PORT_ADVERTISE_AS=22117
      - KURRENTDB_TRUSTED_ROOT_CERTIFICATES_PATH=/certs/ca
      - KURRENTDB_CERTIFICATE_FILE=/certs/single/node.crt
      - KURRENTDB_CERTIFICATE_PRIVATE_KEY_FILE=/certs/single/node.key
      # Added for when testing v5
      - KURRENTDB_EXT_NODE_PORT_ADVERTISE_AS=2117
    ports:
      - "11116:1113"
      - "22117:2113"
    volumes:
      - ./certs:/certs
    depends_on:
      - geteventstore_promise_test_setup_certs_single
    restart: always
    networks:
      singleclusternetwork:
        ipv4_address: 172.30.239.11

networks:
  singleclusternetwork:
    name: geteventstore_promise_test_single_eventstoredb.local
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.239.0/24