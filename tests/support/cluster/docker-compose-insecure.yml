version: "3.5"

services:
  geteventstore_promise_test_cluster_node1.eventstore: &template
    image: kurrentplatform/kurrentdb:26.1
    container_name: geteventstore_promise_test_cluster_node1.eventstore
    env_file:
      - vars.env
    environment:
      - KURRENTDB_INSECURE=true
      - KURRENTDB_REPLICATION_IP=172.30.240.11
      - KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS=22137
      - KURRENTDB_GOSSIP_SEED=172.30.240.12:2113,172.30.240.13:2113
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --insecure http://geteventstore_promise_test_cluster_node1.eventstore:2113/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
    ports:
      - "11136:1113"
      - "22137:2113"
    restart: always
    networks:
      clusternetwork:
        ipv4_address: 172.30.240.11

  geteventstore_promise_test_cluster_node2.eventstore:
    <<: *template
    container_name: geteventstore_promise_test_cluster_node2.eventstore
    environment:
      - KURRENTDB_INSECURE=true
      - KURRENTDB_REPLICATION_IP=172.30.240.12
      - KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS=22157
      - KURRENTDB_GOSSIP_SEED=172.30.240.11:2113,172.30.240.13:2113
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --insecure http://geteventstore_promise_test_cluster_node2.eventstore:2113/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
    ports:
      - "11156:1113"
      - "22157:2113"
    networks:
      clusternetwork:
        ipv4_address: 172.30.240.12

  geteventstore_promise_test_cluster_node3.eventstore:
    <<: *template
    container_name: geteventstore_promise_test_cluster_node3.eventstore
    environment:
      - KURRENTDB_INSECURE=true
      - KURRENTDB_REPLICATION_IP=172.30.240.13
      - KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS=22177
      - KURRENTDB_GOSSIP_SEED=172.30.240.11:2113,172.30.240.12:2113
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --insecure http://geteventstore_promise_test_cluster_node3.eventstore:2113/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
    ports:
      - "11176:1113"
      - "22177:2113"
    networks:
      clusternetwork:
        ipv4_address: 172.30.240.13

networks:
  clusternetwork:
    name: geteventstore_promise_test_cluster_eventstoredb.local
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.240.0/24